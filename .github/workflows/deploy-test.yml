name: Deploy Notification Service to DigitalOcean (Test)

# Same shape as zm-iam-service/deploy-test.yml — build image, push to Docker
# Hub, SSH into the droplet, docker run against the shared ivy-net. No DB yet
# (Phase 2), so no db-bootstrap step. Kafka must be running on ivy-net.

on:
  push:
    branches:
      - develop

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: zmtechlabs/zm-notification-service:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    # Manual approval gate. Configure reviewers in:
    #   Settings → Environments → `test` → Required reviewers.
    environment: test
    steps:
      - name: Deploy Notification Service (TEST)
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -e

            echo "🔧 Ensure ivy-net network exists"
            docker network inspect ivy-net >/dev/null 2>&1 || docker network create ivy-net

            echo "⬇️ Pull latest image"
            docker pull zmtechlabs/zm-notification-service:latest

            echo "🛑 Stop + remove old container"
            docker stop zm-notification-service || true
            docker rm zm-notification-service || true

            echo "🚀 Start notification service (test)"
            # KAFKA_BOOTSTRAP is the zm-kafka container on ivy-net (its advertised
            # listener, see zm-local-setup/docker-compose.droplet.yml).
            # ZeptoMail token is a baked default in application.yml; override via
            # -e ZEPTO_TOKEN=... (or an env file) if the account changes.
            docker run -d \
              --name zm-notification-service \
              --network ivy-net \
              -p 8384:8384 \
              -e SERVER_PORT=8384 \
              -e KAFKA_BOOTSTRAP=zm-kafka:9092 \
              -e NOTIFICATION_TOPIC=zm.notifications.v1 \
              zmtechlabs/zm-notification-service:latest

            echo "✅ Notification service (test) deployed successfully"
