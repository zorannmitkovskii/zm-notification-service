name: Deploy Notification Service to DigitalOcean (Prod)

# Same shape as deploy-test.yml, targeting the prod droplet + a `production`
# environment gate. Kafka must be running on ivy-net there too.

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: zmtechlabs/zm-notification-service:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    # Manual approval gate. Configure reviewers in:
    #   Settings → Environments → `production` → Required reviewers.
    environment: production
    steps:
      - name: Deploy Notification Service (PROD)
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.DROPLET_IP_PROD }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -e

            echo "🔧 Ensure ivy-net network exists"
            docker network inspect ivy-net >/dev/null 2>&1 || docker network create ivy-net

            echo "⬇️ Pull latest image"
            docker pull zmtechlabs/zm-notification-service:latest

            echo "🛑 Stop + remove old container"
            docker stop zm-notification-service || true
            docker rm zm-notification-service || true

            echo "🚀 Start notification service (prod)"
            # KAFKA_BOOTSTRAP is the zm-kafka container on ivy-net (its advertised
            # listener, see zm-local-setup/docker-compose.droplet.yml).
            # In prod, override the ZeptoMail token via env instead of the baked
            # default: add `--env-file /opt/ivy-events/env/notification.env` with
            # ZEPTO_TOKEN=... (secret hygiene).
            docker run -d \
              --name zm-notification-service \
              --network ivy-net \
              -p 8384:8384 \
              -e SERVER_PORT=8384 \
              -e KAFKA_BOOTSTRAP=zm-kafka:9092 \
              -e NOTIFICATION_TOPIC=zm.notifications.v1 \
              zmtechlabs/zm-notification-service:latest

            echo "✅ Notification service (prod) deployed successfully"
